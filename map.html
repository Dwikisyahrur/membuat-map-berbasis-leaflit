<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map lokasi penting Cisaat</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

    <h1>Map lokasi penting Cibolang</h1>
    <div id="map" style="height: 700px;">Isi map</div>

    <script>
        var map = L.map('map').setView([-6.9049845, 106.870959], 17);

        // Tambah data OSM
        var OSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Tambah data geojson
        fetch("map.geojson")
            .then(res => res.json())
            .then(data => L.geoJSON(data, {
                onEachFeature: function (feature, layer) {
                    const nama = feature.properties.nama;
                    const deskripsi = feature.properties.deskripsi;
                    layer.bindPopup(`<b>${nama}</b><br><br>${deskripsi}`);
                }
            }).addTo(map))
            .catch(err => console.error("Gagal memuat file GeoJSON:", err));
    </script>

</body>

</html>
